<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
{% if noindex %}<meta name="robots" content="noindex, nofollow">
{% endif %}<meta name="color-scheme" content="dark">
<meta name="theme-color" content="{{ site.theme_color }}">
<script>document.documentElement.classList.replace('no-js','js')</script>
{{{ preloads }}}<style>{{{ critical_css }}}</style>
{{{ deferred_css }}}<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/img/brand/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/img/brand/apple-touch-icon.png">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
{% if og_image_url %}<meta property="og:image" content="{{ og_image_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ og_image_url }}">
{% endif %}<meta name="twitter:site" content="@VectorWorkflows">
{{{ scripts }}}
