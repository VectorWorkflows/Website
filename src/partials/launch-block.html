{% if pricing.launch %}<aside class="launchblock" aria-labelledby="launch-title">
  <div class="launchblock__core">
    <div class="launchblock__say">
      <h2 id="launch-title" class="launchblock__title">{{ pricing.launch_title }} — <em>{{ pricing.launch_until }}</em></h2>
      <p class="launchblock__reason">{{ pricing.launch_reason }}</p>
    </div>
    <ul class="launchblock__tiers" role="list">
      {% for t in pricing.tier_rows %}<li><span class="launchblock__what">{{ t.label }}</span><span class="launchblock__price" data-copy><span class="launchblock__now">{{ t.now }}</span><s class="launchblock__was"><span class="sr-only">standard price </span>{{ t.was }}</s></span></li>
      {% endfor %}
    </ul>
  </div>
</aside>{% endif %}
